<div class="main-wrapper">

  <!-- FORM -->
  <div class="form-container">
    <h1>Employee Form</h1>

    <form #empForm="ngForm" (ngSubmit)="onSubmit(empForm)">

      <!-- NAME -->
     <div class="input-group">
  <input type="text" name="name" ngModel placeholder=" ">
  <label>Name</label>
</div>

      <!-- PHONE -->
      <div class="input-group">
      <input type="text" name="phoneNumber" [(ngModel)]="employee.phoneNumber" required />
        <label>Phone Number</label>
      </div>

      <!-- DEPARTMENT (MANUAL INPUT) -->
<div class="input-group">
<input type="text" name="department" ngModel placeholder=" ">
  <label>Department</label>
</div>

      <!-- ADDRESS -->
      <div class="input-group">
        <textarea rows="3" name="address" ngModel placeholder=" "></textarea>
        <label>Address</label>
      </div>

      <!-- GENDER -->
      <div class="gender">
        <span>Gender:</span><br>

        <label>
         <input type="radio" name="gender" value="true" ngModel> Male
        </label>

        <label>
          <input type="radio" name="gender" value="false" ngModel> Female
        </label>
      </div>

      <!-- BUTTON -->
      <button type="submit">Submit</button>

    </form>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <h2>Employee List</h2>

    <table>
  <tr>
    <th>Name</th>
    <th>PhoneNumber</th>
    <th>Department</th>
    <th>Address</th>
    <th>Gender</th>
  </tr>

  <tr *ngFor="let emp of employees">
    <td>{{ emp.name }}</td>
    <td>{{ emp.phoneNumber }}</td>
    <td>{{ emp.department }}</td>
    <td>{{ emp.address }}</td>
    <td>{{ emp.gender }}</td>
  </tr>
</table>
  </div>

</div>
